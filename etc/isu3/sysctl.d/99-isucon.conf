# nginx の受付キュー。ベンチは新規ユーザーごとに新しい TLS 接続を張るので、瞬間的に接続が集中する。
# 既定の tcp_max_syn_backlog=256 / listen backlog 511 で ListenOverflows が 8.5 万回出ていた（ISUCON14）。
# 確認: nstat -az | grep -E 'ListenOverflows|ListenDrops'
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 8192
net.ipv4.ip_local_port_range = 10000 65535
net.ipv4.tcp_tw_reuse = 1

# 3 万接続を L4 で中継すると既定の tcp_mem（圧迫 222MB / 上限 333MB）を超え、受信キューで捨てて RTO 待ちになる
# （isu1 で TCPMemoryPressures 12 回・RcvQDrop 59 万・TCPTimeouts 9 万。ベンチ終了間際の dial timeout の原因）
net.ipv4.tcp_mem = 131072 196608 262144
net.ipv4.tcp_rmem = 4096 65536 1048576
net.ipv4.tcp_wmem = 4096 32768 1048576
net.ipv4.tcp_max_tw_buckets = 262144
