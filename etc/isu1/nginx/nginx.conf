user www-data;
worker_processes auto;
worker_rlimit_nofile 400000;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 100000; # stream は 1 クライアント接続で 2 スロット使う。8192 だと開始 16 秒で枯渇した
	multi_accept on;
}

# 443 は L4 で各ノードのアプリ (TLS 直終端, :8443) に流す。テナント DB はノードローカルなので SNI (=テナント) で担当を固定する。
# upstream の並び・weight を変えるとテナントの担当が変わる（ベンチ中に変えない）
stream {
	# isu1 は L4 中継 + MySQL + SaaS 管理者 API (admin.t.isucon.local) だけを受け持ち、テナントは isu2 / isu3 に載せる
	# （isu1 に載せたテナントは nginx と CPU を取り合って isu2/3 の 77% のペースしか出ず、nginx の応答も遅れる）
	upstream app_tls {
		hash $ssl_preread_server_name consistent;
		server __ISU2_IP__:8443;
		server __ISU3_IP__:8443;
	}
	upstream admin_tls {
		server 127.0.0.1:8443;
	}
	map $ssl_preread_server_name $tls_upstream {
		admin.t.isucon.local admin_tls;
		default              app_tls;
	}
	server {
		listen 443 backlog=8192;
		ssl_preread on;
		# 既定は preread 16k + proxy 16k×2 = 接続あたり約 50KB。3 万接続で nginx が 1.5GB 使い、isu1 が TCP メモリ圧迫に入った
		preread_buffer_size 4k;
		proxy_buffer_size 8k;
		proxy_connect_timeout 5s;
		proxy_timeout 600s;
		proxy_pass $tls_upstream;
	}
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;
	server_tokens off;

	keepalive_requests 1000000;
	keepalive_timeout 120s;
	http2_max_requests 1000000;

	ssl_session_cache shared:SSL:32m;
	ssl_session_timeout 1h;

	open_file_cache          max=2000 inactive=300s;
	open_file_cache_valid    60s;
	open_file_cache_errors   off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_buffer_size       16k;
	proxy_buffers           8 32k;
	proxy_busy_buffers_size 64k;
	client_body_buffer_size 2m;

	log_format ltsv "time:$time_local"
		"\thost:$remote_addr"
		"\tmethod:$request_method"
		"\turi:$request_uri"
		"\tstatus:$status"
		"\tsize:$body_bytes_sent"
		"\treqtime:$request_time"
		"\tapptime:$upstream_response_time"
		"\tvhost:$host"
		"\tupstream:$upstream_addr"
		"\tproto:$server_protocol"
		"\tconn:$connection"
		"\tconn_req:$connection_requests"
		"\tssl_reused:$ssl_session_reused";
	access_log /var/log/nginx/access.log ltsv buffer=64k flush=1s;
	error_log /var/log/nginx/error.log;

	gzip off;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
