# テナント DB (SQLite) はノードローカルなので、テナント (= Host) ごとに担当ノードを固定する
upstream app {
  hash $host consistent;
  server 127.0.0.1:3000 weight=1;
  server __ISU2_IP__:3000 weight=2;
  server __ISU3_IP__:3000 weight=2;
  keepalive 256;
  keepalive_requests 1000000;
  keepalive_timeout 120s;
}

server {
  listen 443 ssl http2 backlog=8192;
  server_name *.t.isucon.dev *.t.isucon.local;

  root /home/isucon/public/;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_dhparam         /etc/nginx/tls/dhparam.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

  location / {
    try_files $uri /index.html;
  }

  location ~ ^/(api|initialize) {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 600;
    proxy_pass http://app;
  }

  location /auth/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:3001;
  }
}
